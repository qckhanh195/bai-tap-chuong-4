<!DOCTYPE html>
<html lang="vi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} - Sông Hương</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block styles %}
  <style>
  </style>
  {% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Cà phê Sông Hương</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Trang chủ</a>
        <a class="nav-link" href="/menu">Thực đơn</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">

  <footer class="text-center py-4 text-muted border-top mt-5">
    <p class="m-0">Phạm Hữu Quốc Khánh</p>
  </footer>
